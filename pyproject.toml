# Build system
[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

# Metadatos del paquete
[project]
name = "escuadra"
version = "0.1.0"
description = "Herramientas de calculo de ingenieria civil y electrica"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "SIS-INF"}]

dependencies = [
    "PySide6>=6.6,<7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-qt",
    "ruff>=0.4",
    "pyinstaller>=6",
]

[project.scripts]
escuadra = "escuadra.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"

markers = [
    "slow: tests que tardan más de 1 segundo",
    "integration: tests que leen archivos del sistema",
    "unit: tests unitarios puros"
]

[tool.coverage.run]
source = ["src/escuadra"]
omit = [
    "*/main.py",
    "*/ui/*"
]

[tool.flake8]
# Sincroniza la longitud máxima de línea permitida por Flake8 con el estándar de 88 caracteres de Black
max-line-length = 88

# Códigos omitidos para asegurar la interoperabilidad con el formateador Black:
# E203: Ignora falsos positivos en espacios antes de ':' dentro de expresiones de slicing
# W503: Desactiva la advertencia sobre rupturas de línea ocurridas antes de un operador binario
extend-ignore = ["E203", "W503"]

# Directorios excluidos del análisis estático para omitir dependencias externas y entornos locales
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "build",
    "dist"
]